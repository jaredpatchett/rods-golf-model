name: Update Rod's Golf Model data

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 12-23 * * *"

# Prevents two runs of THIS workflow from racing each other on the final git push — e.g. a
# scheduled run firing while you also click "Run workflow" by hand. cancel-in-progress is
# false on purpose: a run in the middle of "Deploy to Cloudflare" should be allowed to finish,
# not get killed mid-deploy by a second run starting. A second run just waits in queue instead.
concurrency:
  group: update-golf-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pipeline
        env:
          DG_KEY: ${{ secrets.DG_KEY }}
        # Wyndham Championship, Aug 6-9 2026 -- Sedgefield Country Club, par 70, birdie-friendly
        # (recent winners -18 to -22). 69.5 was tuned for Rocket Classic -- leaving it as-is here
        # risks the exact "everything says bet the Over" bug this constant has already caused
        # once before (see the DEFAULT_BASELINE_ROUND_SCORE comment in rods_pipeline.py, from
        # the 3M Open incident). 68.0 is a rough estimate (par 70, -2), not derived from real
        # Sedgefield scoring history -- update this once you've got real data or a couple of
        # rounds in to check it against.
        run: python3 rods_pipeline.py --baseline-score 68.0

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Commit updated data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rods_data.json
          if git diff --cached --quiet; then
            echo "No changes to rods_data.json — skipping commit."
          else
            git commit -m "Auto-update rods_data.json"
            # Retry loop covers the race concurrency: can't fully rule out — e.g. you pushing a
            # commit (like an index.html update) to main at the same moment this step runs.
            # Each attempt re-pulls/rebases onto whatever main actually is right now before
            # retrying the push, instead of failing outright on the first collision.
            attempt=1
            max_attempts=5
            until git pull --rebase origin main && git push; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Push failed after $max_attempts attempts — giving up."
                exit 1
              fi
              echo "Push attempt $attempt failed (likely a concurrent push to main) — retrying..."
              sleep $(( (RANDOM % 10) + 5 ))
              attempt=$((attempt + 1))
            done
          fi
